name: Playwright Enterprise End-to-End Suite
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v5

    - name: setup node.js environment
      uses: actions/setup-node@v5
      with:
        node-version: 24.18.0

    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test
      continue-on-error: true

    - name: Setup Java Runtime (JDK)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin' # Highly reliable open-source JDK distribution
        java-version: '21'

       # 🔐 INJECT ENVIRONMENT SECRETS HERE
    - name: Execute Automated Web UI & API Tests
      run: npx playwright test
      env:
        # Injects your encrypted repository secrets into environment variables
        GITHUB_USER: ${{ secrets.GITHUB_USER }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_USER_SESSION: ${{ secrets.GITHUB_USER_SESSION }}
    - uses: actions/upload-artifact@v5
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
        
 # 5. Compile the raw files into a self-contained HTML folder
    - name: Generate Allure Report
      run: npx allure generate allure-results --clean -o allure-report
      if: always() # Guarantees execution regardless of test failures

      # 6. Compress and upload the entire report folder to the GitHub run summary
    - name: Upload Allure Report as Pipeline Artifact
      uses: actions/upload-artifact@v5
      if: always()
      with:
        name: allure-html-report # Name displayed on your GitHub UI
        path: allure-report/    # The target directory containing your index.html
        retention-days: 14




